<style>
  body{display:flex; align-items:flex-start; justify-content:center; min-height:100vh;}
  .card-wrap{width:100%; max-width:420px; margin:clamp(1.5rem,6vw,3rem) auto; padding:0 1.25rem;}
  .card-sheet{
    background:var(--paper-light); border:2px solid var(--ink);
    box-shadow:7px 7px 0 var(--shadow); padding:2rem 1.6rem 1.8rem;
    text-align:center; transform:rotate(-.6deg);
  }
  .card-logo{
    width:56px; height:56px; margin:0 auto .8rem;
    display:flex; align-items:center; justify-content:center;
  }
  .card-logo svg{width:100%; height:100%; stroke:var(--ink);}
  .card-sheet h1{font-size:1.6rem; margin-bottom:.2rem;}
  .card-tagline{font-family:'Caveat',cursive; color:var(--rust); font-size:1.15rem; display:block; margin-bottom:1.6rem; transform:rotate(-1deg);}
  .card-actions{display:flex; flex-direction:column; gap:.8rem; margin-bottom:1.6rem;}
  .card-btn{
    display:flex; align-items:center; gap:.8rem;
    padding:.85rem 1.1rem; border:2px solid var(--ink); background:var(--paper);
    text-decoration:none; color:var(--ink); font-size:.95rem; font-weight:600;
    box-shadow:3px 3px 0 var(--shadow); transition:transform .15s ease;
  }
  .card-btn:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--shadow);}
  .card-btn svg{width:20px; height:20px; stroke:var(--moss-deep); flex-shrink:0;}
  .card-btn.primary{background:var(--ochre); border-color:var(--ink);}
  .card-social{display:flex; justify-content:center; gap:.9rem; margin-bottom:1.6rem;}
  .card-social a{
    width:40px; height:40px; border:2px solid var(--ink); border-radius:50%;
    display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink);
    font-size:1rem; background:var(--paper); transition:transform .15s ease;
  }
  .card-social a:hover{transform:rotate(-6deg);}
  .card-map{
    border:2px solid var(--ink); box-shadow:4px 4px 0 var(--shadow);
    overflow:hidden; margin-bottom:1rem;
  }
  .card-map iframe{width:100%; height:160px; display:block; filter:grayscale(.25) sepia(.12);}
  .card-address{font-size:.85rem; color:var(--ink-soft);}
  .card-footer-link{display:block; margin-top:1.6rem; font-size:.85rem;}
