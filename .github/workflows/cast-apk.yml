name: Cast Phone APK

on:
  push:
    paths:
      - "cast/**"
      - ".github/workflows/cast-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Tests du cœur (serveur HTTP, SSDP, UPnP contre une fausse TV), puis APK.
      - name: Tests et APK
        run: ./gradlew -Pandroid --no-daemon :core:test :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cast-phone-apk
          path: cast/app/build/outputs/apk/debug/app-debug.apk

      # Lien de téléchargement direct de l'APK, toujours le même, remplacé à chaque build.
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cast-phone.apk
          gh release delete cast-latest --cleanup-tag --yes || true
          gh release create cast-latest cast-phone.apk \
            --prerelease \
            --title "Cast Phone (dernier build)" \
            --notes "APK de test signé avec la clé de débogage. Commit ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
